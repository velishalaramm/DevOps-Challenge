name: Site-Release-CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test_and_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify model checksum and run unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test_and_verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned image only after tests pass
        run: docker build --pull=false -t eoir-stack:${GITHUB_SHA} .
      - name: Check final image size is below 220 MB
        run: |
          size_bytes=$(docker image inspect eoir-stack:${GITHUB_SHA} --format='{{.Size}}')
          max_bytes=$((220 * 1024 * 1024))
          echo "Image size: ${size_bytes} bytes; limit: ${max_bytes} bytes"
          test "$size_bytes" -lt "$max_bytes"
